<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Darkness — Achievement Tracker</title><style>:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#080808;color:#f4f4f4}body{max-width:850px;margin:auto;padding:20px 16px 70px}h1{font-size:clamp(25px,5vw,38px)}h2{font-size:24px;margin:8px 0}p{color:#aaa;line-height:1.55}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#222;border-radius:18px;text-align:center;padding:18px 6px}.stat b{display:block;font-size:clamp(22px,5vw,34px);margin:8px 0}.stat span{font-size:12px;color:#aaa}.panel{border:1px solid #333;border-radius:22px;padding:18px;margin:18px 0}details{border-top:1px solid #333;padding:18px 0}summary{font-size:22px;font-weight:700;cursor:pointer}label{display:flex;gap:14px;padding:15px 0;border-top:1px solid #242424;cursor:pointer}input{width:23px;height:23px;flex-shrink:0;accent-color:#ddd}small{display:block;color:#aaa;font-size:12px;margin-bottom:6px}.where{font-weight:600;margin:6px 0}.desc{color:#aaa;line-height:1.5}button{background:#292929;color:white;border:1px solid #555;padding:10px 14px;border-radius:9px;cursor:pointer}header{display:flex;align-items:center;justify-content:space-between;gap:12px}.muted{color:#aaa} .done .name{text-decoration:line-through;color:#888} .controls{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}@media(max-width:430px){.panel{padding:12px}.stat{padding:14px 3px}}</style></head><body><header><div><small>THE DARKNESS · XBOX 360</small><h1>Achievement Tracker</h1></div><button id="reset">Reset</button></header><p>Heart of Gold, Darkling outfits and Underworld letters, arranged chapter by chapter. Your progress is saved on this device.</p><section class="panel"><div class="stats" id="stats"></div><p id="overall"></p><div class="controls"><button id="filter">Show incomplete only: Off</button><button id="export">Export progress</button><button id="import">Import progress</button><input id="file" type="file" accept="application/json" hidden></div><div id="chapters"></div></section><script>
const raw=[
['Chapter 1 — Beginnings',[
['heart','George Handel — first favour','Canal Street, stairs to Chinatown','Speak to George, confront Compton Scarr downstairs and tell him to let George play. Return to George.'],
['heart','Charlane Warburton — four coins','Fulton Street station','Collect all four coins from the tracks in one attempt; ask to retry if needed.'],
['heart','Ingrid Pulanski — lost bracelet','Fulton Street, incoming-train platform','Search the tracks below the platform edge for her bracelet and return it.'],
['outfit','Potato Sack','Chinatown, outside subway','Look for a glowing glass display case near the alley. Smash it and collect the outfit.'],
['outfit','Jungle Outfit','Near Dutch Oven Harry’s hideout','Find the locked room near Matty Forehand. Send Creeping Dark through the upper opening to unlock it.']]],
['Chapter 2 — No Man’s Land',[
['letter','First trenches — bunker hatch','After the plane crash','Break the bunker hatch beyond the low wall and climb down.'],['letter','Barbed-wire bridge','Ruined battlefield','Cross the small barbed-wire bridge to the bunker roof.'],['letter','Crucified creature','Battlefield','Use Creeping Dark to retrieve the letter near its feet.'],['letter','Outside enemy bunker','After Kamikaze Darkling breach','Use Creeping Dark along the outer ledge.'],['letter','British soldier’s bunker','Friendly trenches','Search near the harmonica-playing soldier.'],['letter','Village shack','Village entrance','Turn right after climbing the ladder.'],['letter','Ruined building near church','Village upper paths','Cross two bridges and search left of the cross-marked door.'],['letter','Above the bell','Path towards the Hills','Use Creeping Dark on the raised platform.'],['letter','Side trench','No Man’s Land','Check the left branch before the hilltop.'],['letter','Destroyed house fireplace','After Darkness Guns','Search the ruined house fireplace.'],['letter','Behind sewer entrance','Village return route','Turn around immediately after crouching through the narrow passage.'],['letter','Lower platform at staircase','Sewer staircase','Send Creeping Dark over the railing at the top.'],['letter','Pump tunnels','After draining water','Take the first left through the lower door.'],['letter','Upper bunker railing','Towards Gustav cannon','Search the upper-level railing.'],['letter','Cannon railway gate','Outside Gustav cannon','Follow tracks to the locked gate.'],['letter','Beneath cannon catwalk','Inside Gustav cannon','Use Creeping Dark under the catwalk.'],['letter','Cannon roof ledge','Top of Gustav cannon','Send Creeping Dark along the right ledge before entering controls.']]],
['Chapter 3 — Return to New York',[
['heart','Dana Cutrone — apartment key','Fulton Street → Chinatown','Accept Dana’s request and retrieve her keys from Joey Skelton.'],['outfit','Lumberjack Outfit','Dana’s apartment','Collect the outfit case inside Joey’s apartment.'],['heart','Dana Cutrone — return key','Fulton Street','Return the keys to Dana.'],['heart','Jimmy the Grape — informant','Canal Street → Grinder’s Lane','Kill the informant and recover the list.'],['outfit','Fireman Outfit','Informant’s apartment','Search the room for the outfit case.'],['heart','Jimmy the Grape — return list','Canal Street','Return the list to Jimmy.'],['heart','Vinny — contract 1','Lower East Side','Kill target near Aunt Sarah’s and report back.'],['heart','Vinny — contract 2','Grinder’s Lane','Kill the guarded target and report back.'],['heart','Vinny — contract 3','Lower East Side','Destroy noisy car and occupants; report back.'],['heart','Vinny — contract 4','Chinatown','Kill the dealer between Orchid and Plum; report back.'],['heart','Vinny — contract 5','Gun Hill','Send Creeping Dark through elevated open window to kill surveillance target.'],['outfit','Sledgehammer Outfit','Gun Hill surveillance room','Collect the outfit case near surveillance equipment.'],['heart','Vinny — final report','Fulton Street','Report the fifth contract to Vinny.'],['heart','George Handel — stolen harmonica','Lower East Side','Kill Compton Scarr and recover George’s harmonica. Return it.'],['heart','Terence Willis — Whitefish gang','Canal Street → Whitefish','Eliminate gang and return to Terence.'],['heart','Lucas Hellinger — shell game','Canal Street','Use Terence’s advice, distract Lucas and pick marked cup.'],['heart','Mitch Duval — missing brother','Fulton Street → City Hall tunnels','Follow tunnels, disarm traps and find Mitch’s brother.'],['outfit','Jackhammer Outfit','Abandoned City Hall station','Search the old subway carriage.'],['heart','Mitch Duval — report back','Fulton Street','Return to Mitch after dealing with his brother.']]],
['Chapter 4 — Second Underworld Visit',[
['letter','Under Gustav cannon platform','After cannon hatch','Use Creeping Dark beneath raised platform.'],['letter','Building ladder and grate','Return route','Climb down the ladder and turn right.'],['letter','Sewer entrance grate','Sewers','Collect letter in front of breakable grate.'],['letter','Waterway platform','Sewers','Follow water right and climb onto platform.'],['heart','Charlie Hazelgrove — message for Rosie','Village return route','Speak to Charlie among British soldiers and accept message and locket.'],['letter','Room after giant creature','After tank battle','Enter room on left before following Tony.'],['letter','Castle upper catwalk','Castle bunker','Climb stairs, turn right and follow catwalk.'],['letter','Path after firing cannon','Return from Gustav cannon','Search beside left light before wooden planks.'],['letter','Outside castle entrance','Castle gate','Check final light on right.'],['letter','Dirt mound in corridor','Castle interior','Use Creeping Dark on left dirt mound.'],['letter','Final room with four chairs','Castle interior','Collect letter near gate before interacting with chairs.']]],
['Chapter 5 — Final Return to New York',[
['heart','Rosie Hazelgrove — Charlie’s message','Fulton Street','Wake Rosie and deliver message and locket.'],['heart','Little Petey — letter delivery','Fulton Street → Canal Street','Deliver letter to Mickey Famiano near vending machine.'],['heart','Enzo Scardina — briefcase exchange','Canal Street → Fulton Street','Swap cases with Frankie Noses Tieri and return to Enzo.'],['heart','Alfred Blackmoore — eviction','Canal Street → Chinatown','Confront Dana, retrieve keys and return to Alfred.'],['heart','Frank Rottenberg — insulin','Trinity Cemetery','Use Creeping Dark to retrieve insulin from bathroom and return it.']]]];
const data=raw.map((c,ci)=>({name:c[0],items:c[1].map((r,i)=>({id:`${ci}-${i}`,type:r[0],name:r[1],where:r[2],desc:r[3]}))}));const key='darkness-tracker-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch{}let incomplete=false;const types={heart:['♡','Heart of Gold'],outfit:['♧','Darkling Outfit'],letter:['✉','Underworld Letter']};function render(){let all=data.flatMap(c=>c.items);document.querySelector('#stats').innerHTML=Object.entries(types).map(([t,[icon,name]])=>`<div class="stat"><div>${icon}</div><b>${all.filter(x=>x.type===t&&saved[x.id]).length}/${all.filter(x=>x.type===t).length}</b><span>${name}</span></div>`).join('');document.querySelector('#overall').textContent=`${all.filter(x=>saved[x.id]).length} of ${all.length} steps complete`;document.querySelector('#chapters').innerHTML=data.map(c=>`<details open><summary>${c.name}</summary><p>${c.items.filter(x=>saved[x.id]).length}/${c.items.length} steps complete</p>${c.items.filter(x=>!incomplete||!saved[x.id]).map(x=>`<label class="${saved[x.id]?'done':''}"><input type="checkbox" data-id="${x.id}" ${saved[x.id]?'checked':''}><div><small>${types[x.type][1]}</small><strong class="name">${x.name}</strong><div class="where">${x.where}</div><div class="desc">${x.desc}</div></div></label>`).join('')}</details>`).join('');document.querySelectorAll('input[data-id]').forEach(el=>el.addEventListener('change',()=>{saved[el.dataset.id]=el.checked;localStorage.setItem(key,JSON.stringify(saved));render()}))}document.querySelector('#filter').onclick=()=>{incomplete=!incomplete;document.querySelector('#filter').textContent=`Show incomplete only: ${incomplete?'On':'Off'}`;render()};document.querySelector('#reset').onclick=()=>{if(confirm('Reset all progress?')){saved={};localStorage.setItem(key,'{}');render()}};document.querySelector('#export').onclick=()=>{let a=document.createElement('a'),blob=new Blob([JSON.stringify(saved,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='darkness-progress.json';a.click();URL.revokeObjectURL(a.href)};document.querySelector('#import').onclick=()=>document.querySelector('#file').click();document.querySelector('#file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{saved=JSON.parse(await f.text());localStorage.setItem(key,JSON.stringify(saved));render()}catch{alert('Invalid progress file')}};render();
</script></body></html>
